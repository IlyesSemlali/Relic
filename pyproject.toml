[project]
name = "relic"
version = "0.1.0"
description = "A Borg wrapper that helps create standard backups the smartest way possible"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic-settings>=2.13.1",
    "pyyaml>=6.0.2",
    "rich>=14.3.3",
    "typer>=0.24.1",
]

[project.scripts]
relic = "relic.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relic"]
